<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1c1917; }
      .subtitle { font-size: 13px; fill: #78716c; }
      .boundary-box { fill: #fafaf9; stroke: #a8a29e; stroke-width: 2; stroke-dasharray: 6,4; rx: 12; }
      .boundary-title { font-size: 14px; font-weight: 600; fill: #44403c; letter-spacing: 0.5px; }
      .actor-label { font-size: 13px; font-weight: 600; fill: #1c1917; text-anchor: middle; }
      .actor-role { font-size: 11px; fill: #78716c; text-anchor: middle; }
      .actor-icon { fill: #f5f5f4; stroke: #292524; stroke-width: 2; }
      .usecase-pill { fill: #ffffff; stroke: #0284c7; stroke-width: 1.8; rx: 22; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .usecase-core { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 22; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
      .usecase-text { font-size: 12px; font-weight: 500; fill: #1e293b; text-anchor: middle; }
      .usecase-id { font-size: 10px; font-weight: 700; fill: #0284c7; text-anchor: middle; }
      .usecase-id-core { font-size: 10px; font-weight: 700; fill: #16a34a; text-anchor: middle; }
      .assoc-line { stroke: #64748b; stroke-width: 1.5; }
      .include-line { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; }
      .extend-line { stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; }
      .rel-label { font-size: 10px; font-weight: 600; fill: #475569; text-anchor: middle; background: #ffffff; }
      .tech-badge { font-size: 11px; font-weight: 600; fill: #0369a1; }
    </style>
    <marker id="arrow-include" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-extend" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="42" class="title">USE CASE DIAGRAM — CREAMY COFFEE POS</text>
  <text x="40" y="64" class="subtitle">Arsitektur Fungsional Sistem &amp; Batasan Sistem (ReactJS + Supabase Database + Netlify)</text>

  <!-- Legend -->
  <g transform="translate(780, 25)">
    <rect x="0" y="0" width="420" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="20" cy="25" r="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="35" y="29" font-size="11" fill="#334155">Fitur Inti Transaksi</text>
    <line x1="160" y1="25" x2="195" y2="25" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-include)" />
    <text x="205" y="29" font-size="11" fill="#334155">«include»</text>
    <line x1="280" y1="25" x2="315" y2="25" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-extend)" />
    <text x="325" y="29" font-size="11" fill="#334155">«extend»</text>
  </g>

  <!-- System Boundary -->
  <rect x="220" y="90" width="780" height="740" class="boundary-box" />
  <rect x="240" y="105" width="410" height="26" rx="4" fill="#e7e5e4" />
  <text x="250" y="123" class="boundary-title">«system boundary» Aplikasi Web POS Kafe (Client-Cloud Engine)</text>

  <!-- ==================== ACTORS ==================== -->
  <!-- Aktor 1: Kasir -->
  <g id="actor-kasir" transform="translate(90, 360)">
    <!-- Head -->
    <circle cx="30" cy="30" r="16" class="actor-icon" />
    <!-- Body -->
    <line x1="30" y1="46" x2="30" y2="90" class="actor-icon" />
    <!-- Arms -->
    <line x1="6" y1="64" x2="54" y2="64" class="actor-icon" />
    <!-- Legs -->
    <line x1="30" y1="90" x2="12" y2="125" class="actor-icon" />
    <line x1="30" y1="90" x2="48" y2="125" class="actor-icon" />
    <text x="30" y="146" class="actor-label">Kasir</text>
    <text x="30" y="161" class="actor-role">(Cashier Staff)</text>
  </g>

  <!-- Aktor 2: Barista / Dapur -->
  <g id="actor-barista" transform="translate(1080, 200)">
    <circle cx="30" cy="30" r="16" class="actor-icon" />
    <line x1="30" y1="46" x2="30" y2="90" class="actor-icon" />
    <line x1="6" y1="64" x2="54" y2="64" class="actor-icon" />
    <line x1="30" y1="90" x2="12" y2="125" class="actor-icon" />
    <line x1="30" y1="90" x2="48" y2="125" class="actor-icon" />
    <text x="30" y="146" class="actor-label">Barista / Dapur</text>
    <text x="30" y="161" class="actor-role">(Kitchen Crew)</text>
  </g>

  <!-- Aktor 3: Manajer / Owner -->
  <g id="actor-manager" transform="translate(1080, 560)">
    <circle cx="30" cy="30" r="16" class="actor-icon" />
    <line x1="30" y1="46" x2="30" y2="90" class="actor-icon" />
    <line x1="6" y1="64" x2="54" y2="64" class="actor-icon" />
    <line x1="30" y1="90" x2="12" y2="125" class="actor-icon" />
    <line x1="30" y1="90" x2="48" y2="125" class="actor-icon" />
    <text x="30" y="146" class="actor-label">Manajer / Owner</text>
    <text x="30" y="161" class="actor-role">(Superadmin)</text>
  </g>

  <!-- Aktor 4: Payment Gateway (External) -->
  <g id="actor-gateway" transform="translate(680, 755)">
    <rect x="-10" y="0" width="140" height="50" rx="8" fill="#f8fafc" stroke="#0369a1" stroke-width="1.8" />
    <text x="60" y="24" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">«external system»</text>
    <text x="60" y="40" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Payment QRIS</text>
  </g>

  <!-- ==================== USE CASES ==================== -->
  <!-- UC-01: Login & Shift Kasir -->
  <g id="uc-01" transform="translate(250, 150)">
    <rect x="0" y="0" width="220" height="46" class="usecase-pill" />
    <text x="110" y="18" class="usecase-id">UC-01</text>
    <text x="110" y="34" class="usecase-text">Otentikasi &amp; Buka/Tutup Shift</text>
  </g>

  <!-- UC-02: Input & Kustomisasi Menu -->
  <g id="uc-02" transform="translate(250, 240)">
    <rect x="0" y="0" width="220" height="46" class="usecase-pill" />
    <text x="110" y="18" class="usecase-id">UC-02</text>
    <text x="110" y="34" class="usecase-text">Input Menu &amp; Varian (Gula/Es)</text>
  </g>

  <!-- UC-03: Simpan Bill / Split Bill -->
  <g id="uc-03" transform="translate(540, 240)">
    <rect x="0" y="0" width="200" height="46" class="usecase-pill" />
    <text x="100" y="18" class="usecase-id">UC-03</text>
    <text x="100" y="34" class="usecase-text">Simpan &amp; Split Bill Meja</text>
  </g>

  <!-- UC-04: Transaksi Pembayaran (CORE) -->
  <g id="uc-04" transform="translate(250, 360)">
    <rect x="0" y="0" width="240" height="54" class="usecase-core" />
    <text x="120" y="20" class="usecase-id-core">UC-04 (FITUR INTI)</text>
    <text x="120" y="40" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Proses Transaksi &amp; Bayar</text>
  </g>

  <!-- UC-05: Validasi QRIS -->
  <g id="uc-05" transform="translate(600, 460)">
    <rect x="0" y="0" width="190" height="46" class="usecase-pill" />
    <text x="95" y="18" class="usecase-id">UC-05</text>
    <text x="95" y="34" class="usecase-text">Validasi QRIS / Non-Tunai</text>
  </g>

  <!-- UC-06: Cetak Struk & Label Cup -->
  <g id="uc-06" transform="translate(560, 340)">
    <rect x="0" y="0" width="210" height="46" class="usecase-pill" />
    <text x="105" y="18" class="usecase-id">UC-06</text>
    <text x="105" y="34" class="usecase-text">Cetak Struk &amp; Label Cup Minuman</text>
  </g>

  <!-- UC-08: Pengurangan Stok Resep -->
  <g id="uc-08" transform="translate(250, 480)">
    <rect x="0" y="0" width="230" height="48" class="usecase-core" />
    <text x="115" y="18" class="usecase-id-core">UC-08 (AUTOMATION)</text>
    <text x="115" y="36" class="usecase-text">Pengurangan Stok Bahan (BOM)</text>
  </g>

  <!-- UC-07: Monitoring Antrean KOT Dapur -->
  <g id="uc-07" transform="translate(740, 160)">
    <rect x="0" y="0" width="220" height="48" class="usecase-pill" />
    <text x="110" y="18" class="usecase-id">UC-07</text>
    <text x="110" y="36" class="usecase-text">Monitor &amp; Update Pesanan Dapur</text>
  </g>

  <!-- UC-09: Manajemen Resep & HPP -->
  <g id="uc-09" transform="translate(660, 560)">
    <rect x="0" y="0" width="230" height="46" class="usecase-pill" />
    <text x="115" y="18" class="usecase-id">UC-09</text>
    <text x="115" y="34" class="usecase-text">Kelola Master Resep &amp; HPP Laba</text>
  </g>

  <!-- UC-10: Stock Opname & Waste -->
  <g id="uc-10" transform="translate(660, 630)">
    <rect x="0" y="0" width="230" height="46" class="usecase-pill" />
    <text x="115" y="18" class="usecase-id">UC-10</text>
    <text x="115" y="34" class="usecase-text">Stock Opname &amp; Catat Waste</text>
  </g>

  <!-- UC-11: Laporan & Audit Staf -->
  <g id="uc-11" transform="translate(660, 700)">
    <rect x="0" y="0" width="230" height="46" class="usecase-pill" />
    <text x="115" y="18" class="usecase-id">UC-11</text>
    <text x="115" y="34" class="usecase-text">Audit Staf &amp; Laporan Penjualan</text>
  </g>

  <!-- ==================== ASSOCIATIONS ==================== -->
  <!-- Kasir Lines -->
  <line x1="140" y1="410" x2="250" y2="173" class="assoc-line" />
  <line x1="140" y1="410" x2="250" y2="263" class="assoc-line" />
  <line x1="140" y1="410" x2="250" y2="387" class="assoc-line" stroke-width="2.2" stroke="#16a34a" />

  <!-- Barista Lines -->
  <line x1="1080" y1="260" x2="960" y2="184" class="assoc-line" stroke-width="2" stroke="#0284c7" />

  <!-- Manager Lines -->
  <line x1="1080" y1="620" x2="890" y2="583" class="assoc-line" />
  <line x1="1080" y1="620" x2="890" y2="653" class="assoc-line" />
  <line x1="1080" y1="620" x2="890" y2="723" class="assoc-line" />
  <line x1="1080" y1="620" x2="470" y2="173" class="assoc-line" stroke-dasharray="3,3" />

  <!-- UC-02 extend UC-03 -->
  <line x1="470" y1="263" x2="535" y2="263" class="extend-line" marker-end="url(#arrow-extend)" />
  <rect x="478" y="248" width="54" height="15" fill="#fafaf9" />
  <text x="505" y="259" class="rel-label" fill="#d97706">«extend»</text>

  <!-- UC-04 include UC-06 -->
  <path d="M 490 380 Q 525 365 555 363" class="include-line" marker-end="url(#arrow-include)" />
  <rect x="495" y="356" width="56" height="14" fill="#fafaf9" />
  <text x="523" y="367" class="rel-label" fill="#0284c7">«include»</text>

  <!-- UC-04 include UC-08 -->
  <line x1="370" y1="414" x2="370" y2="475" class="include-line" marker-end="url(#arrow-include)" />
  <rect x="342" y="438" width="56" height="14" fill="#fafaf9" />
  <text x="370" y="449" class="rel-label" fill="#0284c7">«include»</text>

  <!-- UC-04 extend UC-05 -->
  <path d="M 490 405 Q 540 435 595 465" class="extend-line" marker-end="url(#arrow-extend)" />
  <rect x="520" y="426" width="54" height="14" fill="#fafaf9" />
  <text x="547" y="437" class="rel-label" fill="#d97706">«extend»</text>

  <!-- UC-05 to Gateway -->
  <line x1="700" y1="506" x2="730" y2="755" class="assoc-line" stroke-dasharray="4,4" />
</svg>

